[package]
name = "gitlife-assistant"
version = "0.3.0"
description = "GIT Life Assistant desktop shell"
authors = ["GIT Life"]
edition = "2021"

[lib]
name = "gitlife_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
